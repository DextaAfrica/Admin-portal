name: Pull Request Hygiene & Branch Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  branch-policy:
    name: Verify Branch Flow Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate Target Branch Rules
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target Branch: $TARGET_BRANCH"
          echo "Source Branch: $SOURCE_BRANCH"

          # Rule: PRs targeting main should originate from develop, release/*, hotfix/*, or administrative updates
          if [ "$TARGET_BRANCH" = "main" ]; then
            case "$SOURCE_BRANCH" in
              develop|release/*|hotfix/*|admin/*|feat/*|fix/*)
                echo "✅ Target branch policy satisfied ($SOURCE_BRANCH -> main)"
                ;;
              *)
                echo "ℹ️  Notice: PR targeting main from '$SOURCE_BRANCH'."
                ;;
            esac
          fi

  title-check:
    name: Conventional Commit Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Regular expression for Conventional Commits (flexible and case-tolerant)
          REGEX="^([a-zA-Z]+)(\([a-zA-Z0-9_-]+\))?(!)?(:| -) .+"

          if echo "$PR_TITLE" | grep -Eqi "$REGEX"; then
            echo "✅ PR title conforms to Conventional Commits format."
          else
            echo "ℹ️  Notice: PR title '$PR_TITLE' does not strictly follow Conventional Commits syntax."
            echo "💡 Recommended format for clean changelog generation:"
            echo "   • fix(admin): resolve docker build environment and dashboard prerender"
            echo "   • feat(crm): implement executive crm and enterprise operations suite"
            echo "   • chore(ci): update build workflows"
          fi

