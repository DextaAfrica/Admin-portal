name: Continuous Integration (CI)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality & Static Analysis
  # ============================================================================
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Client Generation
        run: npx prisma generate

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # 2. Production Build Verification
  # ============================================================================
  build:
    name: Next.js Standalone Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Engine
        run: npx prisma generate

      - name: Compile Standalone Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "file:./prisma/admin_portal.db"
          APP_SECRET: "ci_build_verification_temporary_secret_key_12345"

  # ============================================================================
  # 3. Docker Container Build Verification
  # Validates that Dockerfile builds cleanly with layer caching
  # ============================================================================
  docker-test:
    name: Docker Build & Smoke Test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run with Layer Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dexta-admin-portal:ci-test
          build-args: |
            DATABASE_URL=file:/app/prisma/admin_portal.db
            APP_SECRET=ci_build_verification_temporary_secret_key_12345
          cache-from: type=gha
          cache-to: type=gha,mode=max

