name: Release & Container Deployment (CD)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Manual release tag (e.g., v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Build Multi-Platform Image & Publish to GitHub Container Registry (GHCR)
  # ============================================================================
  publish-container:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Multi-Architecture Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=file:/app/prisma/admin_portal.db
            APP_SECRET=dexta_build_fallback_secret_key_production_standalone
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Notification
        run: |
          echo "========================================================"
          echo "🎉 Dexta Africa Production Container Published!"
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo "SHA: sha-${{ github.sha }}"
          echo "========================================================"

