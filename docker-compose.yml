name: dexta-africa

services:
  # ============================================================================
  # Dexta Africa Admin Portal Application
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dexta-admin-portal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/admin_portal.db}
      - APP_SECRET=${APP_SECRET:-dexta_africa_portal_super_secure_enterprise_secret_key_2026_xyz}
      - PORTAL_NAME=${PORTAL_NAME:-Dexta Africa Operations Portal}
      - AUTO_MIGRATE=true
      - AUTO_SEED=${AUTO_SEED:-true}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@dextaafrica.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminPassword2026!}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Dexta Super Admin}
      # Local S3 Storage Integration (MinIO)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dexta_minio_user}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-DextaMinioPass2026!}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dexta-assets-storage}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://minio:9000}
      - AWS_S3_FORCE_PATH_STYLE=true
      # Local Email Service (Mailpit)
      - EMAIL_FROM=${EMAIL_FROM:-Dexta Operations <operations@dextaafrica.com>}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - dexta-sqlite-data:/app/prisma
      - dexta-app-data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dexta-internal-net

  # ============================================================================
  # Local S3-Compatible Cloud Storage (MinIO)
  # Allows full testing of file uploads, media vaults, and S3 assets offline
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: dexta-minio-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-dexta_minio_user}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-DextaMinioPass2026!}
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Browser Web Console
    volumes:
      - dexta-minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dexta-internal-net

  # Bucket provisioner: runs once to create the default S3 bucket
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T12-08-03Z
    container_name: dexta-minio-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-dexta_minio_user} ${AWS_SECRET_ACCESS_KEY:-DextaMinioPass2026!};
      /usr/bin/mc mb --ignore-existing localminio/${AWS_S3_BUCKET_NAME:-dexta-assets-storage};
      /usr/bin/mc anonymous set download localminio/${AWS_S3_BUCKET_NAME:-dexta-assets-storage};
      echo '✅ [MinIO] S3 Bucket initialized: ${AWS_S3_BUCKET_NAME:-dexta-assets-storage}';
      exit 0;
      "
    networks:
      - dexta-internal-net

  # ============================================================================
  # Local SMTP Testing Server (Mailpit)
  # Captures all outgoing campaign emails, password resets, and notifications
  # Web UI accessible at http://localhost:8025 with zero external configuration
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: dexta-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP Port
      - "8025:8025"   # Mailpit Web UI Inbox
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - dexta-mail-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dexta-internal-net

volumes:
  dexta-sqlite-data:
    name: dexta-sqlite-data
  dexta-app-data:
    name: dexta-app-data
  dexta-minio-storage:
    name: dexta-minio-storage
  dexta-mail-data:
    name: dexta-mail-data

networks:
  dexta-internal-net:
    name: dexta-internal-net
    driver: bridge

