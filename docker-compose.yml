name: dexta-africa

services:
  # ============================================================================
  # Dexta Africa Admin Portal Application
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dexta-admin-portal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/admin_portal.db}
      - APP_SECRET=${APP_SECRET:-dexta_africa_portal_super_secure_enterprise_secret_key_2026_xyz}
      - PORTAL_NAME=${PORTAL_NAME:-Dexta Africa Operations Portal}
      - AUTO_MIGRATE=true
      - AUTO_SEED=${AUTO_SEED:-true}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@dextaafrica.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminPassword2026!}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Dexta Super Admin}
      # Local Email Service (Mailpit)
      - EMAIL_FROM=${EMAIL_FROM:-Dexta Operations <operations@dextaafrica.com>}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # Core Go Backend Proxy target
      - BACKEND_API_URL=${BACKEND_API_URL:-http://host.docker.internal:8080}
    volumes:
      - dexta-sqlite-data:/app/prisma
      - dexta-uploads-data:/app/public/uploads
      - dexta-app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dexta-internal-net

  # ============================================================================
  # Local SMTP Testing Server (Mailpit)
  # Captures all outgoing campaign emails, password resets, and notifications
  # Web UI accessible at http://localhost:8025 with zero external configuration
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: dexta-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP Port
      - "8025:8025"   # Mailpit Web UI Inbox
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - dexta-mail-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dexta-internal-net

volumes:
  dexta-sqlite-data:
    name: dexta-sqlite-data
  dexta-uploads-data:
    name: dexta-uploads-data
  dexta-app-data:
    name: dexta-app-data
  dexta-mail-data:
    name: dexta-mail-data

networks:
  dexta-internal-net:
    name: dexta-internal-net
    driver: bridge
